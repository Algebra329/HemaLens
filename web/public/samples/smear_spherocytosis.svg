<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="plasmaBg3" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fdf4f5" />
      <stop offset="60%" stop-color="#faeaed" />
      <stop offset="100%" stop-color="#f3dce0" />
    </radialGradient>
    
    <!-- Spherocyte (Intensely stained, hyperdense red, complete absence of central pallor) -->
    <radialGradient id="spherocyteRbc" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d93850" />
      <stop offset="50%" stop-color="#ba1e38" />
      <stop offset="90%" stop-color="#961329" />
      <stop offset="100%" stop-color="#70091b" />
    </radialGradient>

    <!-- Normal RBC with pallor -->
    <radialGradient id="normalRbc3" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fce7ea" />
      <stop offset="35%" stop-color="#f29ba6" />
      <stop offset="75%" stop-color="#df4e63" />
      <stop offset="100%" stop-color="#b62a40" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#plasmaBg3)" />

  <!-- Normal RBCs -->
  <circle cx="120" cy="110" r="32" fill="url(#normalRbc3)" />
  <circle cx="120" cy="110" r="13" fill="#fce7ea" />

  <circle cx="280" cy="90" r="30" fill="url(#normalRbc3)" />
  <circle cx="280" cy="90" r="12" fill="#fce7ea" />

  <circle cx="680" cy="140" r="31" fill="url(#normalRbc3)" />
  <circle cx="680" cy="140" r="12" fill="#fce7ea" />

  <circle cx="150" cy="460" r="32" fill="url(#normalRbc3)" />
  <circle cx="150" cy="460" r="13" fill="#fce7ea" />

  <circle cx="620" cy="480" r="33" fill="url(#normalRbc3)" />
  <circle cx="620" cy="480" r="14" fill="#fce7ea" />

  <!-- SPHEROCYTES (Smaller, hyperdense sphere, NO central white pallor) -->
  <circle cx="220" cy="160" r="26" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="160" cy="270" r="25" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="340" cy="210" r="27" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="270" cy="330" r="26" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="430" cy="150" r="25" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="490" cy="260" r="27" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="390" cy="360" r="26" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="580" cy="320" r="25" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="510" cy="410" r="27" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="330" cy="470" r="25" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />
  <circle cx="450" cy="490" r="26" fill="url(#spherocyteRbc)" filter="drop-shadow(0px 1px 2px rgba(0,0,0,0.25))" />

  <!-- SCHISTOCYTES (Fragmented helmet cells / triangular pieces) -->
  <!-- Helmet cell 1 -->
  <path d="M 540 180 Q 565 170 580 195 Q 560 200 540 180 Z" fill="#b91c36" />
  <!-- Triangle fragment 2 -->
  <polygon points="230,410 255,425 225,435" fill="#ba1e38" />
  <!-- Helmet cell 3 -->
  <path d="M 640 250 Q 670 240 660 270 Q 635 265 640 250 Z" fill="#9f122a" />
</svg>
