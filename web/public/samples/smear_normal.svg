<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Slide background texture -->
    <radialGradient id="plasmaBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fdf4f5" />
      <stop offset="60%" stop-color="#faeaed" />
      <stop offset="100%" stop-color="#f3dce0" />
    </radialGradient>
    
    <!-- Normal Discocyte gradient (biconcave disc with pale center) -->
    <radialGradient id="normalRbc" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fce7ea" />
      <stop offset="35%" stop-color="#f29ba6" />
      <stop offset="75%" stop-color="#df4e63" />
      <stop offset="100%" stop-color="#b62a40" />
    </radialGradient>

    <!-- Platelet -->
